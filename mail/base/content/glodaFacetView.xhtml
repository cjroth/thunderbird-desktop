<!DOCTYPE html>
<html xmlns="http://www.w3.org/1999/xhtml">
  <head>
    <title data-l10n-id="search-results-title"></title>
    <meta
      http-equiv="Content-Security-Policy"
      content="default-src chrome:; script-src chrome: 'unsafe-inline' moz-src:; style-src chrome: 'unsafe-inline'"
    />
    <link rel="localization" href="messenger/glodaFacetView.ftl" />
    <link rel="stylesheet" href="chrome://messenger/skin/glodaFacetView.css" />
    <script src="chrome://messenger/content/glodaFacet.js"></script>
    <script src="chrome://messenger/content/glodaFacetView.js"></script>
    <script src="chrome://messenger/content/protovis-r2.6-modded.js"></script>
    <script src="chrome://messenger/content/glodaFacetVis.js"></script>
  </head>
  <body id="body" class="search-page" onload="reachOutAndTouchFrame()">
    <facet-popup-menu class="popup-menu" variety="invisible" />
    <main id="gloda-facet-view" class="search-workspace">
      <header class="search-header">
        <div class="search-heading">
          <div class="query-line">
            <h1
              id="query-explanation"
              class="search-title"
              dir="auto"
              tabindex="-1"
            ></h1>
            <button
              id="edit-search"
              class="button icon-button icon-only toolbar-button edit-search"
              data-l10n-id="search-edit"
              hidden="hidden"
            ></button>
          </div>
          <p id="result-count" class="result-count" role="status"></p>
          <p id="semantic-search-status" role="status" hidden="hidden"></p>
        </div>
        <div class="search-actions">
          <button
            id="filter-toggle"
            class="button icon-button filter-toggle"
            aria-expanded="false"
            aria-controls="filter-panel"
            data-l10n-id="search-filters"
            hidden="hidden"
          ></button>
          <button
            id="clear-filters"
            class="button toolbar-button clear-filters"
            data-l10n-id="search-clear-filters"
            hidden="hidden"
          ></button>
          <select
            id="sortby"
            class="select"
            data-l10n-id="search-sort"
            hidden="hidden"
          >
            <option value="-dascore" data-l10n-id="search-sort-relevance" />
            <option value="-date" data-l10n-id="search-sort-date" />
          </select>
          <button
            id="gloda-showall"
            class="button toolbar-button icon-button open-list"
            onclick="FacetContext.showActiveSetInTab()"
            data-l10n-id="search-open-list"
            hidden="hidden"
          ></button>
        </div>
      </header>

      <div class="search-content">
        <aside
          id="filter-panel"
          class="filter-panel"
          aria-labelledby="filter-header-label"
          hidden="hidden"
        >
          <h2
            id="filter-header-label"
            class="filter-heading"
            data-l10n-id="search-filters"
          ></h2>
          <div class="date-controls">
            <label for="date-range" data-l10n-id="search-date-label"></label>
            <div class="date-actions">
              <select
                id="date-range"
                class="select"
                data-l10n-id="search-date-range"
              >
                <option value="" data-l10n-id="search-date-any" />
                <option
                  id="date-custom"
                  value="custom"
                  data-l10n-id="search-date-custom"
                />
              </select>
              <button
                id="date-toggle"
                class="button toolbar-button icon-button gloda-timeline-button"
                aria-controls="facet-date"
                aria-expanded="false"
                data-l10n-id="search-timeline"
              ></button>
            </div>
            <form
              id="custom-date-range"
              class="date-custom-range"
              hidden="hidden"
            >
              <label>
                <span data-l10n-id="search-date-start"></span>
                <input id="date-from" type="date" required="required" />
              </label>
              <label>
                <span data-l10n-id="search-date-end"></span>
                <input id="date-through" type="date" required="required" />
              </label>
              <button
                class="button"
                type="submit"
                data-l10n-id="search-date-apply"
              ></button>
            </form>
            <facet-date
              id="facet-date"
              class="facetious date-facet"
              type="date"
            />
          </div>
          <div id="facets" class="facets">
            <div class="message-filters">
              <facet-boolean
                id="facet-fromMe"
                type="boolean"
                attr="fromMe"
                uninitialized="true"
              />
              <facet-boolean
                id="facet-toMe"
                type="boolean"
                attr="toMe"
                uninitialized="true"
              />
              <facet-boolean
                id="facet-star"
                type="boolean"
                attr="star"
                uninitialized="true"
              />
              <facet-boolean-filtered
                id="facet-attachmentTypes"
                type="boolean-filtered"
                attr="attachmentTypes"
                groupDisplayProperty="categoryLabel"
                uninitialized="true"
              />
            </div>
          </div>
        </aside>

        <div id="data-column" class="result-column">
          <facet-results-message id="results" class="results" />
          <div id="showLoading" class="search-loading" role="status">
            <img src="chrome://messenger/skin/icons/spinning.svg" alt="" />
            <span data-l10n-id="search-loading"></span>
          </div>
          <div id="showEmpty" class="search-empty" hidden="hidden">
            <img
              src="chrome://messenger/skin/icons/empty-search-results.svg"
              alt=""
            />
            <h2 data-l10n-id="search-empty"></h2>
            <p id="empty-hint" data-l10n-id="search-empty-hint"></p>
          </div>
          <button
            id="showMore"
            class="button show-more"
            hidden="hidden"
            onclick="FacetContext.showMore()"
            data-l10n-id="search-show-more"
          ></button>
        </div>
      </div>
    </main>
  </body>
</html>
